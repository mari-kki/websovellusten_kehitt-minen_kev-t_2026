<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="#">Brand</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- GRID -->
    <div class="container mt-4">
      <div class="row text-center">
        <div class="col-md-4 col-12 p-3 border">Football</div>
        <div class="col-md-4 col-12 p-3 border">teams</div>
        <div class="col-md-4 col-12 p-3 border">Matches</div>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="container mt-4">
      <button class="btn btn-primary me-2">Primary</button>
      <button class="btn btn-secondary me-2">Secondary</button>
      <button class="btn btn-success">Success</button>
    </div>

    <!-- CARD -->
    <div class="container mt-4">
      <div class="card" style="width: 18rem">
        <img
          src="./images/jalkapallonkuva.jpg"
          class="card-img-top"
          alt="Card Image"
        >
        <div class="card-body">
          <h5 class="card-title">Football</h5>
          <p class="card-text">
            Football is one of the most popular sports in the world.
          </p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
    </div>

    <!-- ALERT -->
    <div class="container mt-4">
      <div class="alert alert-warning" role="alert">
        This is a warning alert—check it out!
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
